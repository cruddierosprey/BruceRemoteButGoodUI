name: One-shot Firmware SSD1306 Build

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    if: github.event.pull_request.title == 'BUILD_FIRMWARE_SSD1306_N16R8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware fork
        uses: actions/checkout@v4
        with:
          repository: cruddierosprey/firmware
          ref: b8cc3e6cde3be7abe3c3f7b6a08e878183c43aad
          path: firmware

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          pip install requests esptool intelhex platformio

      - name: Build ESP32-S3 DevKitC N16R8
        working-directory: firmware
        shell: bash
        run: |
          set -o pipefail
          platformio run -e esp32-s3-devkitc-1-psram 2>&1 | tee build-esp32-s3-devkitc-1-psram.log

      - name: Collect flash files
        working-directory: firmware
        shell: bash
        run: |
          set -e
          OUT=.pio/build/esp32-s3-devkitc-1-psram
          test -f Bruce-esp32-s3-devkitc-1-psram.bin
          test -f "$OUT/bootloader.bin"
          test -f "$OUT/partitions.bin"
          test -f "$OUT/firmware.bin"

          mkdir -p flash-package
          cp Bruce-esp32-s3-devkitc-1-psram.bin flash-package/Bruce-SSD1306-Adafruit-merged-0x0.bin
          cp "$OUT/bootloader.bin" flash-package/bootloader-0x0.bin
          cp "$OUT/partitions.bin" flash-package/partitions-0x8000.bin
          cp "$OUT/firmware.bin" flash-package/firmware-0x10000.bin

          BOOT_APP0=$(find .pio -type f -name boot_app0.bin | head -n 1 || true)
          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" flash-package/boot_app0-0xe000.bin
          fi

          cat > flash-package/FLASH_ADDRESSES.txt <<'EOF'
          ESP32-S3-DevKitC-1 N16R8 / Bruce Adafruit SSD1306

          Preferred single-file flash:
            Bruce-SSD1306-Adafruit-merged-0x0.bin -> 0x0000

          Separate-file flash:
            bootloader-0x0.bin   -> 0x0000
            partitions-0x8000.bin -> 0x8000
            boot_app0-0xe000.bin  -> 0xE000 (only if this file is present)
            firmware-0x10000.bin  -> 0x10000
          EOF

          sha256sum flash-package/* | tee flash-package/SHA256SUMS.txt
          ls -lh flash-package

      - name: Verify Adafruit backend in build log
        working-directory: firmware
        shell: bash
        run: |
          grep -E "Adafruit (GFX|SSD1306)" build-esp32-s3-devkitc-1-psram.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-SSD1306-Adafruit-ESP32S3-N16R8-v3
          path: |
            firmware/flash-package/*
            firmware/build-esp32-s3-devkitc-1-psram.log
          if-no-files-found: error
          retention-days: 1
