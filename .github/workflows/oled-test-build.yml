name: Build ESP32-S3 OLED Test
on:
  push:
    branches: [ oled-test-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio esptool
      - name: Build
        working-directory: oled-test
        run: pio run
      - name: Prepare binaries
        run: |
          BUILD=oled-test/.pio/build/esp32-s3-devkitc-1
          cp "$BUILD/firmware.bin" ESP32-S3-OLED-TEST.bin
          cp "$BUILD/bootloader.bin" bootloader.bin
          cp "$BUILD/partitions.bin" partitions.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" boot_app0.bin
          esptool.py --chip esp32s3 merge_bin -o ESP32-S3-OLED-TEST-MERGED.bin --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0000 bootloader.bin \
            0x8000 partitions.bin \
            0xe000 boot_app0.bin \
            0x10000 ESP32-S3-OLED-TEST.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-OLED-TEST-MERGED
          path: |
            ESP32-S3-OLED-TEST-MERGED.bin
            ESP32-S3-OLED-TEST.bin
            bootloader.bin
            partitions.bin
            boot_app0.bin
